services:
  app:
    build: .
    image: device-register
    restart: unless-stopped

    # ADMIN_PASSWORD and SESSION_SECRET come from here. Copy .env.example to
    # .env and set both before the first run; the app refuses to start on the
    # placeholder values.
    env_file: .env

    environment:
      DATABASE_PATH: /data/register.db
      PORT: "3000"
      # Set SECURE_COOKIES=1 in .env once a reverse proxy terminates HTTPS.

    # Bound to the loopback address, so the app is reachable only through the
    # reverse proxy you put in front of it. To expose it directly on a trusted
    # network instead, change this to "3000:3000".
    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      # Every correction lives here. Back this volume up.
      - register-data:/data
      # The CSVs built from the workbook, read-only: only `npm run import`
      # reads them, and the app never writes to them.
      - ./data:/app/data:ro

volumes:
  register-data:
